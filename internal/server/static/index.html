<title>Tern · 双语阅读</title>
<script>
  // The desktop embeds this page in a native window (ui.WebView). In that
  // mode the native toolbar owns the reading controls, so the page hides its
  // own chrome and takes its mode and size from the URL.
  (function () {
    var params = new URLSearchParams(location.search);
    if (params.get("embed") === "1") {
      document.documentElement.classList.add("embed");
    }
    try {
      var mode = localStorage.getItem("theme");
      if ((mode === "light" || mode === "dark") && !document.documentElement.classList.contains("embed")) {
        document.documentElement.dataset.theme = mode;
      }
    } catch (e) {}
  })();
</script>
<style>
/* ------------------------------------------------------------------ tokens */
:root {
  --paper: #fbfbfb;
  --paper-2: #f2f1ee;
  --paper-3: #eae9e5;
  --ink: #122a31;
  --ink-2: #465b61;
  --ink-3: #7e8f92;
  --rule: #e5e4e0;
  --rule-strong: #d5d4cf;
  --accent: #17505c;
  --accent-soft: rgba(23, 80, 92, 0.1);
  --danger: #b3261e;

  --serif: 'Iowan Old Style', 'Palatino Linotype', 'Songti SC', 'Source Han Serif SC',
    'Noto Serif CJK SC', Georgia, serif;
  --sans: system-ui, -apple-system, 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;

  --masthead-h: 54px;
  --page-max: 1180px;
  --measure: 40em;
  --read-scale: 1;
  --radius: 4px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --paper: #111112;
    --paper-2: #1a1a1c;
    --paper-3: #232326;
    --ink: #f1e7d4;
    --ink-2: #b9c6c7;
    --ink-3: #83969b;
    --rule: #2a2a2d;
    --rule-strong: #3a3a3e;
    --accent: #4e9aa7;
    --accent-soft: rgba(78, 154, 167, 0.18);
    --danger: #ef8a7d;
  }
}

html[data-theme='dark'] {
  --paper: #111112;
  --paper-2: #1a1a1c;
  --paper-3: #232326;
  --ink: #f1e7d4;
  --ink-2: #b9c6c7;
  --ink-3: #83969b;
  --rule: #2a2a2d;
  --rule-strong: #3a3a3e;
  --accent: #4e9aa7;
  --accent-soft: rgba(78, 154, 167, 0.18);
  --danger: #ef8a7d;
}

html[data-theme='light'] { color-scheme: light; }
html[data-theme='dark'] { color-scheme: dark; }

* { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  overscroll-behavior: none;
}

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.6;
  overflow-x: hidden;
  overscroll-behavior-y: none;
  touch-action: pan-y;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

::selection { background: var(--accent-soft); }

button, a, input { touch-action: manipulation; }

a { color: inherit; }

button { font: inherit; color: inherit; }

img { max-width: 100%; display: block; }

/* ------------------------------------------------------------------ masthead */
.masthead {
  position: sticky;
  top: 0;
  z-index: 70;
  height: var(--masthead-h);
  background: color-mix(in oklab, var(--paper) 94%, transparent);
  border-bottom: 1px solid var(--rule);
  backdrop-filter: saturate(180%) blur(16px);
  -webkit-backdrop-filter: saturate(180%) blur(16px);
  padding-top: env(safe-area-inset-top);
}

.masthead__inner {
  max-width: var(--page-max);
  height: var(--masthead-h);
  margin: 0 auto;
  padding: 0 22px;
  display: flex;
  align-items: center;
  gap: 18px;
}

.wordmark {
  display: flex;
  align-items: baseline;
  gap: 9px;
  text-decoration: none;
  min-width: 0;
}

.wordmark__mark {
  font-family: var(--serif);
  font-style: italic;
  font-size: 21px;
  font-weight: 600;
  letter-spacing: 0.01em;
}

.wordmark__tag {
  font-size: 10px;
  letter-spacing: 0.18em;
  color: var(--ink-3);
  white-space: nowrap;
}

.masthead__right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 16px;
  min-width: 0;
}

.theme-toggle {
  flex: none;
  width: 26px;
  height: 26px;
  padding: 0;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: none;
  color: var(--ink-2);
  font-size: 13px;
  line-height: 1;
  display: grid;
  place-items: center;
  cursor: pointer;
}

.theme-toggle:active { background: var(--paper-2); }

.theme-toggle svg { width: 15px; height: 15px; display: block; }

.nav { display: flex; align-items: center; gap: 16px; }

.nav__link {
  font-size: 12.5px;
  color: var(--ink-2);
  text-decoration: none;
  padding: 4px 0;
  border-bottom: 1px solid transparent;
  white-space: nowrap;
}

.nav__link.is-active { color: var(--ink); border-bottom-color: var(--ink); }

.masthead__back {
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  margin-left: -6px;
  border-radius: 50%;
  color: var(--ink-2);
  text-decoration: none;
  font-size: 15px;
}

.masthead__back:hover { background: var(--paper-2); }

/* ------------------------------------------------------------------ page */
.page {
  max-width: var(--page-max);
  margin: 0 auto;
  padding: 0 22px calc(80px + env(safe-area-inset-bottom));
}

.kicker {
  font-size: 10.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--accent);
}

.mono { font-family: var(--mono); }

/* ------------------------------------------------------------------ feed */
.feed-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
  padding: 26px 0 16px;
  border-bottom: 1px solid var(--rule);
  margin-bottom: 28px;
}

.feed-head .kicker { color: var(--ink-3); }

.feed-head__hint { font-size: 11.5px; color: var(--ink-3); }

/* A line for loading, hints and errors: always there, so showing one never
   moves the grid below it. */
.status-line {
  min-height: 18px;
  margin: 0 0 14px;
  font-size: 12px;
  line-height: 1.5;
  color: var(--ink-3);
}

.status-line.is-error { color: var(--danger); }

.feed-empty {
  max-width: 520px;
  padding: 34px 0 60px;
}

.feed-empty h1 {
  margin: 8px 0;
  font-family: var(--serif);
  font-size: 24px;
  font-weight: 600;
}

.feed-empty p {
  margin: 0 0 18px;
  font-size: 13.5px;
  line-height: 1.75;
  color: var(--ink-2);
}

.feed {
  columns: 3 302px;
  column-gap: 34px;
}

.card {
  break-inside: avoid;
  margin: 0 0 40px;
  animation: rise 0.55s cubic-bezier(0.2, 0.7, 0.3, 1) both;
}

.card__link { display: block; text-decoration: none; color: inherit; }

.card__cover {
  overflow: hidden;
  background: var(--paper-2);
  border-radius: var(--radius);
}

.card__cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.7s cubic-bezier(0.2, 0.7, 0.3, 1);
}

.card__link:hover .card__cover img { transform: scale(1.03); }

.card__body { padding-top: 14px; }

.card__title {
  margin: 7px 0 0;
  font-family: var(--serif);
  font-size: 21px;
  line-height: 1.34;
  font-weight: 600;
  letter-spacing: -0.005em;
  text-wrap: pretty;
}

.card__title-en {
  margin: 7px 0 0;
  font-family: var(--serif);
  font-style: italic;
  font-size: 13.5px;
  line-height: 1.45;
  color: var(--ink-3);
  text-wrap: pretty;
}

.card__summary {
  margin: 10px 0 0;
  font-size: 13.5px;
  line-height: 1.75;
  color: var(--ink-2);
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card__meta {
  margin: 12px 0 0;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  font-size: 11px;
  letter-spacing: 0.04em;
  color: var(--ink-3);
}

/* ------------------------------------------------------------------ skeletons */
.skeleton { animation: none; }

.line {
  height: 12px;
  border-radius: 3px;
  background: var(--paper-2);
  margin: 10px 0;
}

.line--short { width: 30%; }
.line--mid { width: 68%; }
.line--title { height: 26px; width: 84%; }

.article--loading .cover-skeleton {
  margin: 28px 0 0;
  aspect-ratio: 3 / 2;
  border-radius: var(--radius);
  background: var(--paper-2);
}

.article--loading .line { margin: 12px 0; }

/* ------------------------------------------------------------------ article */
.progress {
  position: fixed;
  top: calc(var(--masthead-h) + env(safe-area-inset-top) - 2px);
  left: 0;
  right: 0;
  height: 2px;
  z-index: 80;
  pointer-events: none;
}

.progress span {
  display: block;
  height: 100%;
  background: var(--accent);
  transform-origin: 0 50%;
  transform: scaleX(0);
  transition: transform 0.12s linear;
}

.article {
  max-width: 720px;
  margin: 0 auto;
  padding-top: 40px;
}

.article__kicker {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  font-size: 11px;
  color: var(--ink-3);
}

.article__title {
  margin: 15px 0 0;
  font-family: var(--serif);
  font-size: clamp(27px, 4.6vw, 40px);
  line-height: 1.26;
  font-weight: 600;
  letter-spacing: -0.012em;
  text-wrap: balance;
}

.article__title-en {
  margin: 11px 0 0;
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(15px, 2vw, 18px);
  line-height: 1.5;
  color: var(--ink-3);
  text-wrap: pretty;
}

.article__meta {
  margin: 17px 0 0;
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  font-size: 11.5px;
  letter-spacing: 0.05em;
  color: var(--ink-3);
}

.article__cover { margin: 28px 0 4px; }

.article__cover img { width: 100%; border-radius: var(--radius); }

.article__body { margin-top: 32px; }

.block--p { margin: 0 0 26px; }

.t--zh {
  margin: 0;
  font-family: var(--serif);
  font-size: calc(1.0625rem * var(--read-scale));
  line-height: 1.9;
  color: var(--ink);
  letter-spacing: 0.012em;
  text-wrap: pretty;
}

.t--en {
  margin: 0;
  font-family: var(--sans);
  font-size: calc(1.005rem * var(--read-scale));
  line-height: 1.74;
  font-weight: 450;
  color: var(--ink);
  text-wrap: pretty;
}

[data-en-block] { cursor: pointer; }

.article[data-mode='dual'] .block--p .t--en + .t--zh { margin-top: 10px; }

.article[data-mode='zh'] .block--p,
.article[data-mode='en'] .block--p { max-width: var(--measure); }

.block--h2 {
  margin: 44px 0 18px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-weight: 600;
}

.block--h2 .t--zh { font-size: calc(1.16rem * var(--read-scale)); line-height: 1.5; }

.block--h2 .t--en {
  font-size: calc(1.05rem * var(--read-scale));
  line-height: 1.5;
  color: var(--ink-2);
  font-weight: 600;
}

.block--figure { margin: 32px 0; }

.block--figure img { width: 100%; border-radius: var(--radius); }

.block--figure figcaption {
  margin-top: 10px;
  font-size: 12px;
  line-height: 1.6;
  color: var(--ink-3);
}

.figcaption-en { display: block; font-size: 11.5px; opacity: 0.85; }

.block--quote {
  margin: 30px 0;
  padding: 4px 0 4px 20px;
  border-left: 2px solid var(--accent);
}

.block--quote .t--en { margin-top: 8px; }

.block--quote cite {
  display: block;
  margin-top: 10px;
  font-size: 11.5px;
  font-style: normal;
  color: var(--ink-3);
}

.block--list { margin: 0 0 26px; padding-left: 1.15em; }

.block--list li { margin: 9px 0; }

.block--list .t--en { display: block; margin-top: 2px; font-size: calc(0.95rem * var(--read-scale)); }

.note {
  margin-top: 12px;
  padding: 10px 12px;
  background: var(--paper-2);
  border-radius: var(--radius);
  font-size: 12.5px;
  line-height: 1.7;
  color: var(--ink-2);
}

.note__label {
  display: inline-block;
  margin-right: 8px;
  font-size: 10px;
  letter-spacing: 0.1em;
  color: var(--accent);
}

.article__foot {
  margin-top: 52px;
  padding-top: 20px;
  border-top: 1px solid var(--rule);
  font-size: 12.5px;
  color: var(--ink-3);
}

.article__summary {
  margin: 0 0 14px;
  font-family: var(--serif);
  font-size: 15px;
  line-height: 1.8;
  color: var(--ink-2);
}

.article__foot a {
  color: var(--ink-2);
  text-decoration: none;
  border-bottom: 1px solid var(--rule);
}

/* ------------------------------------------------------------------ toolbar */
.toolbar { display: flex; align-items: center; gap: 8px; user-select: none; -webkit-user-select: none; }

.segmented {
  display: inline-flex;
  padding: 2px;
  gap: 2px;
  border: 1px solid var(--rule);
  border-radius: 999px;
}

.segmented__item {
  border: none;
  background: none;
  border-radius: 999px;
  padding: 3px 10px;
  font-size: 11.5px;
  color: var(--ink-2);
  cursor: pointer;
  white-space: nowrap;
}

.segmented__item.is-active { background: var(--ink); color: var(--paper); }

.toolbar__size { display: flex; gap: 4px; }

.icon {
  background: none;
  border: 1px solid var(--rule);
  border-radius: 999px;
  padding: 3px 8px;
  font-size: 11.5px;
  color: var(--ink-2);
  cursor: pointer;
  white-space: nowrap;
}

.icon:active { background: var(--paper-2); }

.icon:disabled { opacity: 0.4; cursor: default; }

/* The word whose meaning is (or was last) shown. Drawn by the browser's
   highlight registry: nothing is inserted into the text, so the line keeps the
   shaping it had and the paragraph cannot reflow. */
::highlight(word-hit) {
  background-color: var(--accent-soft);
  color: inherit;
}

/* ------------------------------------------------------------------ lookup */
/* A word's meaning drops from the top edge as a full-width sheet, over the
   masthead, and closes itself a few seconds later. It is fixed, so the text
   never moves to make room for it, and its height never changes. */
.lookup {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 90;
  height: calc(104px + env(safe-area-inset-top));
  padding-top: env(safe-area-inset-top);
  box-sizing: border-box;
  background: var(--paper);
  border-bottom: 1px solid var(--rule);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.14);
  visibility: hidden;
}
.lookup.is-open { visibility: visible; }
.lookup__inner {
  max-width: 720px;
  height: 100%;
  margin: 0 auto;
  padding: 12px 16px;
  box-sizing: border-box;
  display: flex;
  align-items: flex-start;
  gap: 12px;
}
.lookup__text {
  flex: 1;
  min-width: 0;
  max-height: 80px;
  overflow-y: auto;
  scrollbar-width: none;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.lookup__text::-webkit-scrollbar { display: none; }
.lookup__head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px; }
.lookup__term { font-family: var(--serif); font-size: 17px; font-weight: 600; }
.lookup__phonetic { font-size: 11.5px; color: var(--ink-3); }
.lookup__pos { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
.lookup__def { margin: 0; font-size: 13px; line-height: 1.55; }
.lookup__hint, .lookup__error { margin: 0; font-size: 12px; line-height: 1.5; color: var(--ink-3); }
.lookup__error { color: var(--danger); }

.lookup__say {
  flex: none;
  align-self: center;
  width: 38px;
  height: 38px;
  padding: 0;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: var(--paper-2);
  color: var(--ink);
  font-size: 16px;
  line-height: 1;
  display: grid;
  place-items: center;
  cursor: pointer;
}

.lookup__say:active { background: var(--paper-3); }

.lookup__say svg { width: 19px; height: 19px; display: block; }
.chip {
  border: 1px solid transparent;
  background: var(--ink);
  color: var(--paper);
  border-radius: 999px;
  padding: 6px 13px;
  font-size: 12px;
  cursor: pointer;
}

.chip:disabled { opacity: 0.55; cursor: default; }


/* ------------------------------------------------------------------ vocab */
.panel { max-width: 640px; margin: 0 auto; padding-top: 46px; }

.panel__title {
  margin: 12px 0 10px;
  font-family: var(--serif);
  font-size: clamp(26px, 4vw, 34px);
  line-height: 1.25;
  font-weight: 600;
}

.panel__lede { margin: 0 0 26px; font-size: 14px; line-height: 1.8; color: var(--ink-2); }

.empty { max-width: 520px; margin: 90px auto; text-align: center; }

.empty h1 { margin: 10px 0; font-family: var(--serif); font-size: 27px; font-weight: 600; }

.empty p { margin: 0 0 20px; font-size: 14px; line-height: 1.8; color: var(--ink-2); }

.empty--inline { margin: 26px 0; text-align: left; font-size: 13px; color: var(--ink-3); }

.link { color: var(--accent); text-decoration: none; }

/* ------------------------------------------------------------------ dual layout */
@media (min-width: 1000px) {
  .article[data-mode='dual'] { max-width: 1060px; }

  .article[data-mode='dual'] .block--p {
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: 0;
    align-items: start;
  }

  .article[data-mode='dual'] .block--p .t--en { padding-right: 30px; }

  .article[data-mode='dual'] .block--p .t--zh {
    padding-left: 30px;
    border-left: 1px solid var(--rule);
  }

  .article[data-mode='dual'] .block--p .note { grid-column: 1 / -1; }

  .article[data-mode='dual'] .block--h2 { display: grid; grid-template-columns: 1fr 1fr; }

  .article[data-mode='dual'] .block--h2 .t--en { padding-right: 30px; }

  .article[data-mode='dual'] .block--h2 .t--zh { padding-left: 30px; border-left: 1px solid var(--rule); }

  .article[data-mode='dual'] .article__head,
  .article[data-mode='dual'] .article__cover,
  .article[data-mode='dual'] .article__foot { max-width: 720px; margin-inline: auto; }
}

/* ------------------------------------------------------------------ embed */
/* An embedded reader is narrower than the window (the sidebar takes 220 of
   it), so the two-column comparison comes earlier there. */
@media (min-width: 780px) {
  html.embed .article[data-mode='dual'] { max-width: 1060px; }

  html.embed .article[data-mode='dual'] .block--p {
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: 0;
    align-items: start;
  }

  html.embed .article[data-mode='dual'] .block--p .t--en { padding-right: 30px; }

  html.embed .article[data-mode='dual'] .block--p .t--zh {
    padding-left: 30px;
    border-left: 1px solid var(--rule);
  }

  html.embed .article[data-mode='dual'] .block--p .note { grid-column: 1 / -1; }

  html.embed .article[data-mode='dual'] .block--h2 { display: grid; grid-template-columns: 1fr 1fr; }

  html.embed .article[data-mode='dual'] .block--h2 .t--en { padding-right: 30px; }

  html.embed .article[data-mode='dual'] .block--h2 .t--zh { padding-left: 30px; border-left: 1px solid var(--rule); }

  html.embed .article[data-mode='dual'] .article__head,
  html.embed .article[data-mode='dual'] .article__cover,
  html.embed .article[data-mode='dual'] .article__foot { max-width: 720px; margin-inline: auto; }
}


/* The reading page inside the desktop window: the native toolbar above it
   owns the mode and the size, so the page keeps only the document. */
html.embed .masthead { display: none; }
html.embed .chat { padding-top: 18px; }
html.embed .progress { top: 0; }
html.embed .page { padding: 0 26px 32px; }
html.embed .article { padding-top: 6px; }
html.embed .article__kicker { padding-top: 14px; }
html.embed .back-home { display: none; }
html.embed .article__foot { margin-top: 34px; }
html.embed .article__foot a { display: none; }

/* ------------------------------------------------------------------ phone */
@media (max-width: 720px) {
  :root { --masthead-h: 50px; }

  .masthead__inner { padding: 0 16px; gap: 10px; }

  .wordmark__tag { display: none; }

  .nav { gap: 14px; }

  .nav__link { font-size: 12px; }

  .page { padding: 0 16px calc(56px + env(safe-area-inset-bottom)); }

  .feed { columns: 1; }

  .feed-head { display: none; }

  .feed-head__hint { display: none; }

  .card { margin-bottom: 32px; }

  .card__title { font-size: 20px; }

  .article { padding-top: 24px; }

  .article__title { font-size: clamp(24px, 7.2vw, 30px); }

  .article__body { margin-top: 26px; }

  .t--zh { line-height: 1.94; }

  .panel { padding-top: 30px; }

  /* The article page keeps the reader toolbar in the masthead: the nav links
     would not fit beside it on a phone. */
  .masthead--article .nav { display: none; }
  .masthead--chat .nav { display: none; }

  .toolbar { gap: 6px; }

  .segmented__item { padding: 3px 9px; }

  .empty { margin: 60px auto; }
}

@media (max-width: 380px) {
  .toolbar__size .icon:first-child { display: none; }
}

/* ------------------------------------------------------------------ motion */
@keyframes rise {
  from { opacity: 0; transform: translateY(9px); }
  to { opacity: 1; transform: none; }
}

/* Transform only: an opacity animation could be caught half-way by a
   screenshot or a throttled tab, leaving a see-through panel. */
@keyframes pop {
  from { transform: translateY(5px) scale(0.985); }
  to { transform: none; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.001s !important; transition-duration: 0.001s !important; }
  html { scroll-behavior: auto; }
}

/* ------------------------------------------------------------------ threads */
.thread-list { margin: 0; }
.thread-row {
  display: block;
  padding: 15px 0 14px;
  border-bottom: 1px solid var(--rule);
  text-decoration: none;
  color: inherit;
}
.thread-row__top { display: flex; align-items: baseline; gap: 10px; }
.thread-row__title {
  font-family: var(--serif);
  font-size: 16.5px;
  font-weight: 600;
  line-height: 1.45;
  min-width: 0;
}
.thread-row__meta {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 12px;
  margin-top: 6px;
  font-size: 11.5px;
  color: var(--ink-3);
}
.state {
  flex: none;
  font-size: 10px;
  letter-spacing: 0.08em;
  padding: 1px 7px;
  border: 1px solid var(--rule-strong);
  border-radius: 999px;
  color: var(--ink-2);
  white-space: nowrap;
}
.state--running { color: var(--accent); border-color: var(--accent); }
.state--error { color: var(--danger); border-color: var(--danger); }

.import { display: flex; gap: 8px; margin: 16px 0 6px; }
.import__input {
  flex: 1;
  min-width: 0;
  padding: 10px 12px;
  font: inherit;
  font-size: 14px;
  color: var(--ink);
  background: var(--paper);
  border: 1px solid var(--rule-strong);
  border-radius: 9px;
  -webkit-appearance: none;
}
.import__input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
.import .chip { flex: none; }

/* One conversation: the page does not scroll, the log does, so the composer
   keeps its place while the phone's browser bar comes and goes. */
body.chat-page {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  overflow: hidden;
}
body.chat-page .masthead { flex: none; position: static; }
body.chat-page .page {
  flex: 1 1 auto;
  min-height: 0;
  width: 100%;
  padding-bottom: 0;
  display: flex;
  flex-direction: column;
}
.thread {
  flex: 1 1 auto;
  min-height: 0;
  max-width: 720px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
}
.status-line { flex: none; }
.thread > .status-line { margin: 14px 0 10px; }
/* The page's own control in the masthead: the chat has no back link (the
   browser's swipe does that) and nothing else to put up there. */
.masthead__action {
  font-size: 12px;
  color: var(--ink-2);
  text-decoration: none;
  padding: 2px 0;
  white-space: nowrap;
}
.masthead__action:hover { color: var(--ink); }

.chat {
  list-style: none;
  margin: 0;
  padding: 20px 0 10px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}
.chat__who { font-size: 10px; letter-spacing: 0.08em; color: var(--ink-3); margin-bottom: 4px; }
.chat__bubble {
  max-width: 92%;
  padding: 10px 14px;
  border-radius: 12px;
  background: var(--paper-2);
  font-size: 14px;
  line-height: 1.65;
  overflow-wrap: anywhere;
}
.chat--user .chat__bubble { background: var(--paper-3); }
.chat__text { font-size: 14.5px; line-height: 1.75; white-space: pre-wrap; overflow-wrap: anywhere; }
.chat__text code {
  font-family: var(--mono);
  font-size: 0.92em;
  padding: 1px 4px;
  border-radius: 4px;
  background: var(--paper-3);
}
.chat__tools {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 14px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-3);
  margin-top: -4px;
}
.chat__tool { white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.chat__note { font-size: 12px; color: var(--ink-3); line-height: 1.6; }

.composer {
  flex: none;
  z-index: 30;
  display: flex;
  align-items: flex-end;
  gap: 8px;
  padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
  background: color-mix(in oklab, var(--paper) 92%, transparent);
  backdrop-filter: saturate(180%) blur(12px);
  -webkit-backdrop-filter: saturate(180%) blur(12px);
  border-top: 1px solid var(--rule);
}
.composer__text {
  flex: 1;
  min-width: 0;
  min-height: 42px;
  max-height: 150px;
  padding: 11px 12px;
  font: inherit;
  font-size: 14px;
  line-height: 1.5;
  color: var(--ink);
  background: var(--paper-2);
  border: 1px solid var(--rule);
  border-radius: 10px;
  resize: none;
}
.composer__text:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
.composer .chip { flex: none; height: 42px; }

</style>
</head>
<body>
<header class="masthead" id="masthead">
  <div class="masthead__inner">
    <a class="wordmark" href="/" aria-label="Tern 首页">
      <span class="wordmark__mark">Tern</span>
      <span class="wordmark__tag">双语阅读</span>
    </a>
    <div class="masthead__right" id="masthead-right">
      <nav class="nav">
        <a class="nav__link" href="/" data-nav="home">首页</a>
        <a class="nav__link" href="/threads" data-nav="threads">对话</a>
      </nav>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换到深色模式">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" /></svg>
      </button>
    </div>
  </div>
</header>

<main class="page" id="page"></main>

<script>
(() => {
  'use strict';

  // ------------------------------------------------------------------ state
  const MODE_KEY = 'tern:mode';
  const SIZE_KEY = 'tern:size';
  const MODES = ['dual', 'zh', 'en'];
  const SIZES = ['sm', 'md', 'lg'];
  const SCALE = { sm: 0.94, md: 1, lg: 1.12 };

  const read = (key, allowed, fallback) => {
    const saved = localStorage.getItem(key);
    return allowed.includes(saved) ? saved : fallback;
  };

  const params = new URLSearchParams(location.search);
  const EMBEDDED = document.documentElement.classList.contains('embed');
  const fromURL = (key, allowed) => {
    const value = params.get(key);
    return allowed.includes(value) ? value : null;
  };

  const reader = {
    mode: fromURL('mode', MODES) || read(MODE_KEY, MODES, 'dual'),
    size: fromURL('size', SIZES) || read(SIZE_KEY, SIZES, 'md'),
  };

  const page = document.getElementById('page');
  const right = document.getElementById('masthead-right');

  const esc = (value) =>
    String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');

  const formatDate = (iso, dots) => {
    if (!iso) return '';
    const date = new Date(iso);
    if (Number.isNaN(date.getTime())) return '';
    const pad = (n) => String(n).padStart(2, '0');
    if (dots) return `${date.getFullYear()}.${pad(date.getMonth() + 1)}.${pad(date.getDate())}`;
    return `${date.getFullYear()} 年 ${date.getMonth() + 1} 月 ${date.getDate()} 日`;
  };

  async function api(path, options) {
    const response = await fetch(path, {
      ...options,
      headers: { 'Content-Type': 'application/json', ...(options && options.headers) },
      signal: AbortSignal.timeout(options && options.method === 'POST' ? 240000 : 20000),
    });
    const text = await response.text();
    let data = {};
    try { data = text ? JSON.parse(text) : {}; } catch { data = {}; }
    if (!response.ok) throw new Error(data.error || `请求失败（${response.status}）`);
    return data;
  }

  // ------------------------------------------------------------------ chrome
  function setNav(active) {
    document.querySelectorAll('[data-nav]').forEach((link) => {
      link.classList.toggle('is-active', link.dataset.nav === active);
    });
  }

  // Scroll positions: coming back to the feed or an article should not jump to
  // the top, so each page keeps its own offset for the session.
  const posKey = (suffix) => `tern:pos:${location.pathname}${suffix || ''}`;

  function watchScroll() {
    let frame = 0;
    const save = () => {
      if (frame) return;
      frame = requestAnimationFrame(() => {
        frame = 0;
        sessionStorage.setItem(posKey(), String(window.scrollY));
        const bar = document.querySelector('.progress span');
        if (bar) {
          const max = document.documentElement.scrollHeight - window.innerHeight;
          const ratio = max > 0 ? Math.min(1, window.scrollY / max) : 0;
          bar.style.transform = `scaleX(${ratio})`;
        }
      });
    };
    window.addEventListener('scroll', save, { passive: true });
    return save;
  }

  function restoreScroll() {
    const saved = Number(sessionStorage.getItem(posKey()) || '0');
    if (saved > 0) requestAnimationFrame(() => window.scrollTo(0, saved));
  }

  // ------------------------------------------------------------------ feed
  function card(article) {
    const ratio =
      article.cover && article.cover.ratio
        ? article.cover.ratio
        : ['4 / 3', '3 / 2', '1 / 1', '5 / 4'][hash(article.id) % 4];
    const cover = article.cover
      ? `<div class="card__cover" style="aspect-ratio:${ratio}">
           <img src="${esc(article.cover.src)}" alt="${esc(article.cover.alt || '')}" loading="lazy" decoding="async" />
         </div>`
      : '';
    return `<article class="card">
      <a class="card__link" href="/a/${encodeURIComponent(article.id)}">
        ${cover}
        <div class="card__body">
          ${article.tags && article.tags[0] ? `<span class="kicker">${esc(article.tags[0])}</span>` : ''}
          <h2 class="card__title">${esc(article.title.zh)}</h2>
          ${article.title.en ? `<p class="card__title-en">${esc(article.title.en)}</p>` : ''}
          <p class="card__summary">${esc(article.summary.zh || article.summary.en)}</p>
          <p class="card__meta">
            ${article.source.site ? `<span>${esc(article.source.site)}</span>` : ''}
            <span>${esc(formatDate(article.source.publishedAt || article.createdAt, true))}</span>
            <span>${article.paragraphCount} 段</span>
            ${article.vocab && article.vocab.length ? `<span>${article.vocab.length} 生词</span>` : ''}
          </p>
        </div>
      </a>
    </article>`;
  }

  function hash(text) {
    let h = 0;
    for (const ch of text) h = (h * 31 + ch.charCodeAt(0)) % 997;
    return h;
  }

  function skeletons(count) {
    return Array.from({ length: count })
      .map(
        () => `<div class="card skeleton">
          <div class="card__cover" style="aspect-ratio:4 / 3"></div>
          <div class="card__body">
            <div class="line line--short"></div>
            <div class="line line--title"></div>
            <div class="line line--mid"></div>
          </div>
        </div>`,
      )
      .join('');
  }

  async function renderHome() {
    document.title = 'Tern · 双语阅读';
    setNav('home');
    // The head and the status line exist before the data: loading, failing and
    // the feed itself all start at the same place.
    page.innerHTML = `
      <div class="feed-head">
        <span class="feed-head__hint">点击卡片进入双语对照</span>
      </div>
      <p class="status-line" id="feed-status"></p>
      <section class="feed" id="feed">${skeletons(6)}</section>`;

    const status = document.getElementById('feed-status');
    const feed = document.getElementById('feed');

    let articles;
    try {
      ({ articles } = await api('/api/articles'));
    } catch (error) {
      status.textContent = error.message;
      status.classList.add('is-error');
      feed.innerHTML = '';
      return;
    }

    if (!articles.length) {
      feed.innerHTML = `<div class="feed-empty">
        <span class="kicker">Tern</span>
        <h1>还没有文章</h1>
        <p>在桌面端 Tern 的「对话」里贴一个网页链接，Agent 会把它排成中英对照的一篇。</p>
      </div>`;
      return;
    }

    feed.innerHTML = articles.map(card).join('');
    restoreScroll();
  }

  // ------------------------------------------------------------------ article
  function toolbar(articleId) {
    return `<div class="toolbar">
      <div class="segmented" role="group" aria-label="阅读模式">
        <button class="segmented__item" data-mode="dual">对照</button>
        <button class="segmented__item" data-mode="zh">译文</button>
        <button class="segmented__item" data-mode="en">原文</button>
      </div>
      <div class="toolbar__size">
        <button class="icon" data-size="smaller" aria-label="缩小字号">A−</button>
        <button class="icon" data-size="larger" aria-label="放大字号">A+</button>
      </div>
    </div>`;
  }

  function syncToolbar(article) {
    document.querySelectorAll('[data-mode]').forEach((button) => {
      button.classList.toggle('is-active', button.dataset.mode === reader.mode);
    });
    const host = document.querySelector('.article');
    if (host) {
      host.dataset.mode = reader.mode;
      host.dataset.size = reader.size;
      host.style.setProperty('--read-scale', SCALE[reader.size]);
    }
    const smaller = document.querySelector('[data-size="smaller"]');
    const larger = document.querySelector('[data-size="larger"]');
    if (smaller) smaller.disabled = reader.size === SIZES[0];
    if (larger) larger.disabled = reader.size === SIZES[SIZES.length - 1];
  }

  function bindToolbar(article, repaint) {
    document.querySelectorAll('[data-mode]').forEach((button) => {
      button.addEventListener('click', () => {
        if (reader.mode === button.dataset.mode) return;
        reader.mode = button.dataset.mode;
        localStorage.setItem(MODE_KEY, reader.mode);
        // Only the blocks change with the mode, so rebuild just the body: the
        // page keeps its scroll offset and the toolbar its state.
        repaint();
      });
    });
    document.querySelectorAll('[data-size]').forEach((button) => {
      button.addEventListener('click', () => {
        const step = button.dataset.size === 'larger' ? 1 : -1;
        const index = Math.max(0, Math.min(SIZES.length - 1, SIZES.indexOf(reader.size) + step));
        reader.size = SIZES[index];
        localStorage.setItem(SIZE_KEY, reader.size);
        syncToolbar(article);
      });
    });
  }

  function blockHTML(block) {
    const en = reader.mode !== 'zh' && block.en ? `<p class="t t--en" data-en-block="${esc(block.id)}">${esc(block.en)}</p>` : '';
    const zh = reader.mode !== 'en' ? `<p class="t t--zh">${esc(block.zh)}</p>` : '';

    switch (block.type) {
      case 'p':
        return `<div class="block block--p">
          ${en}${zh}
          ${block.note ? `<aside class="note"><span class="note__label">注</span>${esc(block.note)}</aside>` : ''}
        </div>`;
      case 'h2': {
        // A heading stays a section marker in every mode: the English one in
        // 原文, the Chinese one otherwise.
        const showEN = reader.mode !== 'zh' && Boolean(block.en);
        const showZH = reader.mode !== 'en' || !block.en;
        return `<h2 class="block block--h2">
          ${showEN ? `<span class="t t--en">${esc(block.en)}</span>` : ''}
          ${showZH ? `<span class="t t--zh">${esc(block.zh)}</span>` : ''}
        </h2>`;
      }
      case 'image':
        return `<figure class="block block--figure">
          <img src="${esc(block.src)}" alt="${esc(block.alt || '')}" loading="lazy" decoding="async" />
          ${block.caption && block.caption.zh
            ? `<figcaption>${esc(block.caption.zh)}${
                reader.mode !== 'zh' && block.caption.en
                  ? `<span class="figcaption-en">${esc(block.caption.en)}</span>`
                  : ''
              }</figcaption>`
            : ''}
        </figure>`;
      case 'quote':
        return `<blockquote class="block block--quote">
          ${en}${zh}${block.cite ? `<cite>${esc(block.cite)}</cite>` : ''}
        </blockquote>`;
      case 'list':
        return `<ul class="block block--list">
          ${(block.items || [])
            .map(
              (item) => `<li>
                ${reader.mode !== 'zh' && item.en ? `<span class="t t--en">${esc(item.en)}</span>` : ''}
                ${reader.mode !== 'en' ? `<span class="t t--zh">${esc(item.zh)}</span>` : ''}
              </li>`,
            )
            .join('')}
        </ul>`;
      default:
        return '';
    }
  }

  function articleHTML(article) {
    const words = article.blocks.reduce(
      (n, block) => n + (block.en ? block.en.split(/\s+/).filter(Boolean).length : 0),
      0,
    );
    const minutes = Math.max(1, Math.round(words / 220));
    return `<div class="progress" aria-hidden="true"><span></span></div>
    <article class="article" data-mode="${reader.mode}" data-size="${reader.size}"
             style="--read-scale:${SCALE[reader.size]}">
      <div class="lookup" id="lookup"></div>
      <header class="article__head">
        <div class="article__kicker">
          <a class="nav__link back-home" href="/">← 首页</a>
          ${(article.tags || []).map((tag) => `<span class="kicker">${esc(tag)}</span>`).join('')}
        </div>
        <h1 class="article__title">${esc(article.title.zh)}</h1>
        ${article.title.en ? `<p class="article__title-en">${esc(article.title.en)}</p>` : ''}
        <p class="article__meta">
          ${article.source.site ? `<span>${esc(article.source.site)}</span>` : ''}
          ${article.source.author ? `<span>${esc(article.source.author)}</span>` : ''}
          <span>${esc(formatDate(article.source.publishedAt || article.createdAt, false))}</span>
          <span>约 ${minutes} 分钟</span>
          <span>${words} 词</span>
        </p>
      </header>
      ${article.cover ? `<figure class="article__cover"><img src="${esc(article.cover.src)}" alt="${esc(article.cover.alt || '')}" decoding="async" /></figure>` : ''}
      <div class="article__body">${article.blocks.map(blockHTML).join('')}</div>
      <footer class="article__foot">
        <p class="article__summary">${esc(article.summary.zh || article.summary.en)}</p>
        <a href="${esc(article.source.url || '#')}" target="_blank" rel="noreferrer noopener">原文出处 ↗</a>
      </footer>
    </article>`;
  }

  async function renderArticle(id) {
    setNav('');
    document.getElementById('masthead').classList.add('masthead--article');
    if (!EMBEDDED) right.insertAdjacentHTML('afterbegin', toolbar(id));

    // A page-shaped skeleton: the header does not jump when the article lands.
    page.innerHTML = `<article class="article article--loading" aria-busy="true">
      <div class="line line--short"></div>
      <div class="line line--title"></div>
      <div class="line" style="height:15px;width:52%"></div>
      <div class="line line--mid"></div>
      <div class="cover-skeleton"></div>
      <div class="line"></div>
      <div class="line line--mid"></div>
    </article>`;

    let article;
    try {
      ({ article } = await api(`/api/articles/${encodeURIComponent(id)}`));
    } catch (error) {
      page.innerHTML = `<article class="article">
        <header class="article__head">
          <div class="article__kicker"><a class="nav__link back-home" href="/">← 首页</a></div>
          <h1 class="article__title">打不开这篇</h1>
        </header>
        <p class="status-line is-error">${esc(error.message)}</p>
      </article>`;
      return;
    }

    document.title = `${article.title.zh} · Tern`;
    const lookup = createLookup(article);

    const paintBody = (keepScroll) => {
      const offset = keepScroll ? window.scrollY : 0;
      page.innerHTML = articleHTML(article);
      syncToolbar(article);
      lookup.mount(document.getElementById('lookup'));
      document.querySelector('.article__body').addEventListener('click', (event) => {
        const target = event.target;
        if (!(target instanceof Element)) return;
        if (!target.closest('[data-en-block]')) return;
        const selection = window.getSelection();
        if (selection && String(selection).trim()) return;
        const hit = wordFromPoint(event.clientX, event.clientY);
        if (hit) lookup.show(hit);
      });
      // Switching 对照/译文/原文 changes the body's height; keeping the offset
      // keeps the paragraph the reader was on.
      if (offset > 0) window.scrollTo(0, offset);
    };

    repaintArticle = () => paintBody(true);
    bindToolbar(article, () => paintBody(true));
    paintBody(false);
    watchScroll();
    restoreScroll();
  }

  // ------------------------------------------------------------------ words
  const isWordChar = (ch) => /[A-Za-z'’-]/.test(ch);

  /** From a click, read the character under the pointer, then grow to the word
   *  around it: no <span> per word, native selection stays intact. */
  function wordFromPoint(x, y) {
    let node = null;
    let offset = 0;
    if (document.caretRangeFromPoint) {
      const range = document.caretRangeFromPoint(x, y);
      if (range) {
        node = range.startContainer;
        offset = range.startOffset;
      }
    } else if (document.caretPositionFromPoint) {
      const position = document.caretPositionFromPoint(x, y);
      if (position) {
        node = position.offsetNode;
        offset = position.offset;
      }
    }
    if (!node || node.nodeType !== Node.TEXT_NODE) return null;

    const text = node.textContent || '';
    let start = Math.min(offset, text.length);
    let end = start;
    while (start > 0 && isWordChar(text[start - 1])) start -= 1;
    while (end < text.length && isWordChar(text[end])) end += 1;

    const raw = text.slice(start, end).replace(/^[-'’]+|[-'’]+$/g, '');
    if (raw.length < 2 || !/[A-Za-z]{2}/.test(raw)) return null;

    const range = document.createRange();
    range.setStart(node, start);
    range.setEnd(node, end);
    const rect = range.getBoundingClientRect();
    if (!rect.width) return null;

    const paragraph = node.parentElement && node.parentElement.closest('[data-en-block]');
    return {
      term: raw,
      context: paragraph ? paragraph.textContent.trim() : '',
      rect,
      node,
      start,
      end,
    };
  }

  // createLookup owns the panel over the article: the tap on a word, the
  // entry, saving it. The panel is hidden until a word is asked about and
  // closes itself a few seconds later; it floats over the text, so showing it
  // never moves what the reader is reading.
  function createLookup(article) {
    const local = (term) => {
      const key = term.toLowerCase();
      return (
        (article.vocab || []).find((item) => item.term.toLowerCase() === key) ||
        (article.glossary || []).find((item) => item.term.toLowerCase() === key) ||
        null
      );
    };
    const cache = new Map();
    const supportsHighlight =
      typeof Highlight === 'function' && typeof CSS !== 'undefined' && Boolean(CSS.highlights);
    let bar = null;
    let state = null;
    let watching = false;

    // While the sheet is up a click anywhere means "put it away" — not "look up
    // this other word". Capturing at the document keeps the article's own click
    // handler from seeing that click. A scroll gesture closes it too.
    function onScreenClick(event) {
      if (event.target instanceof Element && event.target.closest('#lookup')) return;
      event.preventDefault();
      event.stopPropagation();
      close();
    }

    function onScreenScroll(event) {
      if (event.target instanceof Element && event.target.closest('#lookup')) return;
      close();
    }

    const watchOptions = { capture: true, passive: true };

    function watch(on) {
      const method = on ? 'addEventListener' : 'removeEventListener';
      document[method]('click', onScreenClick, true);
      document[method]('touchmove', onScreenScroll, watchOptions);
      document[method]('wheel', onScreenScroll, watchOptions);
      window[method]('scroll', onScreenScroll, watchOptions);
      watching = on;
    }

    function close() {
      state = null;
      if (bar) {
        bar.classList.remove('is-open');
        bar.innerHTML = '';
      }
      if (watching) watch(false);
      if (supportsHighlight) CSS.highlights.delete('word-hit');
      stopSpeaking();
    }

    let audio = null;

    function speak(term) {
      stopSpeaking();
      audio = new Audio('/api/say?term=' + encodeURIComponent(term));
      audio.preload = 'auto';
      audio.play().catch(() => {});
    }

    function stopSpeaking() {
      if (!audio) return;
      audio.pause();
      audio.currentTime = 0;
      audio = null;
    }

    function mark(hit) {
      if (!supportsHighlight) return;
      CSS.highlights.delete('word-hit');
      if (!hit.node || !hit.node.isConnected) return;
      const range = document.createRange();
      range.setStart(hit.node, hit.start);
      range.setEnd(hit.node, hit.end);
      CSS.highlights.set('word-hit', new Highlight(range));
    }

    function paint() {
      if (!bar || !state) return;
      const { hit, entry, error, loading } = state;
      bar.classList.add('is-open');
      if (!watching) watch(true);
      bar.innerHTML = `<div class="lookup__inner">
        <div class="lookup__text">
          <div class="lookup__head">
            <strong class="lookup__term">${esc(hit.term)}</strong>
            ${entry && entry.phonetic ? `<span class="lookup__phonetic">/${esc(entry.phonetic.replace(/^\/+|\/+$/g, ''))}/</span>` : ''}
            ${entry && entry.pos ? `<span class="lookup__pos">${esc(entry.pos)}</span>` : ''}
          </div>
          ${loading ? '<p class="lookup__hint">正在生成释义…</p>' : ''}
          ${error ? `<p class="lookup__error">${esc(error)}</p>` : ''}
          ${entry ? `<p class="lookup__def">${esc(entry.zh)}</p>` : ''}
        </div>
        <button class="lookup__say" data-say type="button" aria-label="播放发音">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        </button>
      </div>`;
      const sayButton = bar.querySelector('[data-say]');
      if (sayButton) {
        sayButton.addEventListener('click', (event) => {
          event.stopPropagation();
          speak(hit.term);
        });
      }
    }

    async function show(hit) {
      mark(hit);
      // The Mac synthesizes the word; asking now makes the speaker button play
      // at once instead of waiting for it.
      fetch('/api/say?term=' + encodeURIComponent(hit.term)).catch(() => {});
      const known = local(hit.term) || cache.get(hit.term.toLowerCase());
      if (known) {
        state = { hit, entry: known, error: '', loading: false };
        paint();
        return;
      }
      state = { hit, entry: null, error: '', loading: true };
      paint();
      try {
        const result = await api('/api/lookup', {
          method: 'POST',
          body: JSON.stringify({ term: hit.term, context: hit.context }),
        });
        cache.set(hit.term.toLowerCase(), result.entry);
        if (state && state.hit.term === hit.term) {
          state = { hit, entry: result.entry, error: '', loading: false };
          paint();
        }
      } catch (error) {
        if (state && state.hit.term === hit.term) {
          state = { hit, entry: null, error: error.message, loading: false };
          paint();
        }
      }
    }

    function mount(node) {
      bar = node;
      if (supportsHighlight) CSS.highlights.delete('word-hit');
      if (state) paint();
    }

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') close();
    });

    return { show, mount };
  }

  // One polling timer, shared by the phone's conversation pages.
  let chatTimer = 0;
  const stopChat = () => {
    if (chatTimer) clearTimeout(chatTimer);
    chatTimer = 0;
  };

  function threadHost(url) {
    try {
      return new URL(url).hostname.replace(/^www\./, '');
    } catch {
      return url;
    }
  }

  function timeAgo(iso) {
    const then = new Date(iso).getTime();
    if (Number.isNaN(then)) return '';
    const minutes = Math.max(0, Math.round((Date.now() - then) / 60000));
    if (minutes < 1) return '刚刚';
    if (minutes < 60) return `${minutes} 分钟前`;
    const hours = Math.round(minutes / 60);
    if (hours < 24) return `${hours} 小时前`;
    return formatDate(iso, true);
  }

  function stateLabel(state) {
    if (state === 'running') return '进行中';
    if (state === 'error') return '失败';
    return '已完成';
  }

  function threadRow(t) {
    const title = t.title || threadHost(t.url);
    return `<a class="thread-row" href="/t/${encodeURIComponent(t.id)}">
      <div class="thread-row__top">
        <span class="state state--${esc(t.state)}">${stateLabel(t.state)}</span>
        <span class="thread-row__title">${esc(title)}</span>
      </div>
      <div class="thread-row__meta">
        <span>${esc(threadHost(t.url))}</span>
        <span>${timeAgo(t.updatedAt)}</span>
        ${t.messageCount ? `<span>${t.messageCount} 条</span>` : ''}
      </div>
    </a>`;
  }

  function toolHint(event) {
    if (!event.args) return '';
    try {
      const args = JSON.parse(event.args);
      if (args.command) {
        const word = String(args.command).trim().split(/\s+/)[0];
        return ' ' + word.replace(/^.*\//, '');
      }
      if (args.path) return ' ' + String(args.path).split('/').pop();
    } catch {}
    return '';
  }

  // Inline code is the only markup an assistant message needs: the text is
  // escaped first, so the replacement cannot introduce tags from the model.
  const inlineCode = (text) => text.replace(/`([^`]+)`/g, '<code>$1</code>');

  function chatMarkup(events) {
    const out = [];
    let tools = [];
    const flush = () => {
      if (!tools.length) return;
      out.push(`<li class="chat__tools">${tools
        .map(
          (event) =>
            `<span class="chat__tool" title="${esc(event.detail || event.args || '')}">· ${esc(event.tool)}${esc(toolHint(event))}</span>`,
        )
        .join('')}</li>`);
      tools = [];
    };
    for (const event of events || []) {
      if (event.type === 'tool') {
        tools.push(event);
        continue;
      }
      flush();
      if (event.type === 'user') {
        out.push(
          `<li class="chat--user"><div class="chat__who">你</div><div class="chat__bubble">${esc(event.text)}</div></li>`,
        );
      } else if (event.type === 'assistant') {
        out.push(`<li><div class="chat__who">Tern</div><div class="chat__text">${inlineCode(esc(event.text))}</div></li>`);
      } else if (event.type === 'status') {
        out.push(`<li class="chat__note">${esc(event.text)}</li>`);
      }
    }
    flush();
    return out.join('');
  }

  async function renderThreads() {
    document.title = '对话 · Tern';
    setNav('threads');
    stopChat();
    page.innerHTML = `<section class="panel">
      <h1 class="panel__title">导入与对话</h1>
      <p class="panel__lede">贴一个链接开一个对话。Agent 在这台 Mac 上打开页面、抽出正文、逐段翻译并入库，过程会出现在下面的对话里。</p>
      <form class="import" id="import">
        <input class="import__input" id="import-url" type="url" inputmode="url" autocomplete="off"
          autocapitalize="off" spellcheck="false" placeholder="https://example.com/article" aria-label="网页链接" />
        <button class="chip" id="import-go" type="submit" disabled>开始</button>
      </form>
      <p class="status-line" id="threads-status">读取中…</p>
      <div class="thread-list" id="threads-list"></div>
    </section>`;

    const status = document.getElementById('threads-status');
    const list = document.getElementById('threads-list');
    const form = document.getElementById('import');
    const input = document.getElementById('import-url');
    const go = document.getElementById('import-go');

    const load = async (silent) => {
      try {
        const { threads } = await api('/api/threads');
        list.innerHTML = threads.length
          ? threads.map(threadRow).join('')
          : '<p class="empty--inline">还没有对话。贴一个链接开始。</p>';
        status.textContent = '';
        status.classList.remove('is-error');
        if (threads.some((t) => t.state === 'running')) {
          chatTimer = setTimeout(() => load(true), 1500);
        }
      } catch (error) {
        if (silent) return;
        status.textContent = error.message;
        status.classList.add('is-error');
      }
    };

    input.addEventListener('input', () => {
      go.disabled = !input.value.trim();
    });
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const url = input.value.trim();
      if (!url || go.disabled) return;
      go.disabled = true;
      go.textContent = '创建中…';
      status.textContent = '正在创建对话…';
      status.classList.remove('is-error');
      try {
        const { thread } = await api('/api/threads', { method: 'POST', body: JSON.stringify({ url }) });
        location.assign(`/t/${encodeURIComponent(thread.id)}`);
      } catch (error) {
        status.textContent = error.message;
        status.classList.add('is-error');
        go.disabled = false;
        go.textContent = '开始';
      }
    });

    await load(false);
  }

  async function renderThread(id) {
    document.title = '对话 · Tern';
    setNav('threads');
    stopChat();
    document.getElementById('masthead').classList.add('masthead--chat');
    right.insertAdjacentHTML(
      'afterbegin',
      '<a class="masthead__action" id="thread-read" href="#" hidden>阅读全文 →</a>',
    );
    page.innerHTML = `<section class="thread">
      <p class="status-line" id="thread-status">读取中…</p>
      <ol class="chat" id="chat"></ol>
      <form class="composer" id="composer">
        <textarea class="composer__text" id="composer-text" rows="1" placeholder="继续提要求…" aria-label="消息"></textarea>
        <button class="chip" id="composer-send" type="submit" disabled>发送</button>
      </form>
    </section>`;

    const status = document.getElementById('thread-status');
    const read = document.getElementById('thread-read');
    const chat = document.getElementById('chat');
    const form = document.getElementById('composer');
    const input = document.getElementById('composer-text');
    const send = document.getElementById('composer-send');

    let first = true;
    let lastPaint = '';

    const paint = (thread, running) => {
      read.hidden = !thread.articleId;
      if (thread.articleId) read.href = `/a/${encodeURIComponent(thread.articleId)}`;
      const atBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 90;
      chat.innerHTML = chatMarkup(thread.events);
      if (first || atBottom) {
        requestAnimationFrame(() => {
          chat.scrollTop = chat.scrollHeight;
        });
      }
      first = false;
      input.disabled = running;
      input.placeholder = running
        ? 'Agent 干活中……'
        : thread.articleId
          ? '继续提要求，例如：把第三段翻得更口语一点'
          : '补充说明，或让它继续';
      send.disabled = running || !input.value.trim();
      status.textContent = running ? 'Agent 正在工作…' : thread.state === 'error' ? thread.error : '';
      status.classList.toggle('is-error', thread.state === 'error');
    };

    const load = async () => {
      try {
        const { thread, busy } = await api(`/api/threads/${encodeURIComponent(id)}`);
        const running = thread.state === 'running' || busy;
        const events = thread.events || [];
        const last = events.length ? events[events.length - 1] : null;
        // Repaint only when the log really changed: rebuilding the list every
        // poll would move the scroll position under the reader's thumb.
        const signature = [thread.state, thread.articleId || '', events.length, last ? last.id : '', last ? last.status : ''].join('|');
        if (signature !== lastPaint) {
          lastPaint = signature;
          paint(thread, running);
        }
        if (running) chatTimer = setTimeout(load, 1200);
      } catch (error) {
        status.textContent = error.message;
        status.classList.add('is-error');
      }
    };

    input.addEventListener('input', () => {
      send.disabled = input.disabled || !input.value.trim();
      input.style.height = 'auto';
      input.style.height = `${Math.min(input.scrollHeight, 150)}px`;
    });
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text || send.disabled) return;
      send.disabled = true;
      input.readOnly = true;
      try {
        await api(`/api/threads/${encodeURIComponent(id)}/messages`, {
          method: 'POST',
          body: JSON.stringify({ text }),
        });
        input.value = '';
        input.style.height = '';
        await load();
      } catch (error) {
        status.textContent = error.message;
        status.classList.add('is-error');
      } finally {
        input.readOnly = false;
        send.disabled = !input.value.trim();
      }
    });

    await load();
  }

  // ------------------------------------------------------------------ host API

  // The native toolbar drives the page with these. They keep the page's own
  // preferences in step, so a later reload or the phone finds the same mode.
  let repaintArticle = null;
  window.tern = {
    setMode(mode) {
      if (!MODES.includes(mode) || reader.mode === mode) return reader.mode;
      reader.mode = mode;
      localStorage.setItem(MODE_KEY, mode);
      if (repaintArticle) repaintArticle();
      else syncToolbar(null);
      return reader.mode;
    },
    setSize(size) {
      if (!SIZES.includes(size) || reader.size === size) return reader.size;
      reader.size = size;
      localStorage.setItem(SIZE_KEY, size);
      syncToolbar(null);
      return reader.size;
    },
    state() {
      return {
        mode: reader.mode,
        size: reader.size,
        embed: document.documentElement.classList.contains('embed'),
      };
    },
  };

  // ------------------------------------------------------------------ theme
  // The page follows the system until the reader picks a side; the choice is
  // kept in localStorage. Inside the desktop app the native theme owns the
  // window, so the embedded page never overrides it.
  const themeButton = document.getElementById('theme-toggle');
  const scheme = window.matchMedia('(prefers-color-scheme: dark)');
  const ICON_MOON =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
  const ICON_SUN =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>';

  function readTheme() {
    try {
      const value = localStorage.getItem('theme');
      return value === 'light' || value === 'dark' ? value : '';
    } catch {
      return '';
    }
  }

  function currentTheme() {
    return readTheme() || (scheme.matches ? 'dark' : 'light');
  }

  function applyTheme() {
    if (document.documentElement.classList.contains('embed')) return;
    const mode = readTheme();
    if (mode) document.documentElement.dataset.theme = mode;
    else delete document.documentElement.dataset.theme;
    const dark = currentTheme() === 'dark';
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', dark ? '#111112' : '#fbfbfb');
    if (themeButton) {
      themeButton.innerHTML = dark ? ICON_SUN : ICON_MOON;
      themeButton.setAttribute('aria-label', dark ? '切换到浅色模式' : '切换到深色模式');
    }
  }

  applyTheme();
  scheme.addEventListener('change', applyTheme);
  if (themeButton) {
    themeButton.addEventListener('click', () => {
      try {
        localStorage.setItem('theme', currentTheme() === 'dark' ? 'light' : 'dark');
      } catch {
        return;
      }
      applyTheme();
    });
  }

  // ------------------------------------------------------------------ boot
  function route() {
    const path = location.pathname.replace(/\/+$/, '') || '/';
    document.body.classList.toggle('chat-page', /^\/t\//.test(path));
    if (path === '/') return renderHome();
    if (path === '/threads') return renderThreads();
    const thread = path.match(/^\/t\/([^/]+)$/);
    if (thread) return renderThread(decodeURIComponent(thread[1]));
    const article = path.match(/^\/a\/([^/]+)$/);
    if (article) return renderArticle(decodeURIComponent(article[1]));
    page.innerHTML = `<section class="empty"><h1>页面不存在</h1><p>链接可能已经失效。</p>
      <p><a class="link" href="/">回到首页</a></p></section>`;
  }

  route();
})();
</script>
</body>
</html>
